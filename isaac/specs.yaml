# 비교 대상 액추에이터 사양 — 출처가 확인된 값만 기입. 빈칸(null)은 공개 자료에 없음.
# 수집일 2026-09-21. 각 항목의 source 를 보고서에 인용한다.
#
# 주의 1: Damiao 드라이버 상수(TMAX/VMAX: DM4310 10/30, DM4340 28/10, DM8009 54/45)는 CAN 인코딩 범위이지 사양이 아니다.
# 주의 2: OpenArm 드라이버는 24V 타입(DM4310/DM4340/DM8009)으로 초기화하지만 실제 버스 전압은 미확인 → 무부하 속도는 실측(const_vel)으로 대체.
# 주의 3: Unitree 팔 모터의 단품 질량·감속비는 미공개 → 토크 밀도(Nm/kg)는 G1/H1 에 대해 계산 불가.

