kscale_kbot_v2:   # 관절→Robstride 매핑 + K-Scale 공개 MJCF/URDF 의 시뮬 파라미터 (클래스별로 다른 값 → 튜닝된 값으로 추정)
  source_metadata: https://github.com/kscalelabs/kscale-assets/blob/master/kbot-v2/metadata.json
  source_mjcf: https://github.com/kscalelabs/kscale-assets/blob/master/kbot-v2/robot.mjcf
