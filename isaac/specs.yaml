# Unitree — 공개 URDF 의 <limit effort/velocity> 와 공개 MuJoCo XML 의 joint 기본값.
# effort 는 "관절 최대 토크" 로 해석 (정격/피크 구분 없음 → 보고서에서 피크로 취급, 명시).
unitree_g1_29dof:
  source_urdf: https://github.com/unitreerobotics/unitree_ros/blob/master/robots/g1_description/g1_29dof_rev_1_0.urdf
  source_mjcf: https://github.com/unitreerobotics/unitree_mujoco/blob/main/unitree_robots/g1/g1_29dof.xml
  mjcf_joint_defaults:          # 팔/손목 클래스 공통. 다리·허리도 같은 값 → 실측 아닌 범용 플레이스홀더일 가능성 높음
    arm_motor:   {armature_kgm2: 0.01, damping: 0.05, frictionloss_Nm: 0.2}
    wrist_motor: {armature_kgm2: 0.01, damping: 0.05, frictionloss_Nm: 0.1}
  joints:
    shoulder_pitch: {effort_Nm: 25, velocity_rads: 37, mjcf_class: arm_motor}
    shoulder_roll:  {effort_Nm: 25, velocity_rads: 37, mjcf_class: arm_motor}
    shoulder_yaw:   {effort_Nm: 25, velocity_rads: 37, mjcf_class: arm_motor}
    elbow:          {effort_Nm: 25, velocity_rads: 37, mjcf_class: arm_motor}
    wrist_roll:     {effort_Nm: 25, velocity_rads: 37, mjcf_class: arm_motor}
    wrist_pitch:    {effort_Nm: 5,  velocity_rads: 22, mjcf_class: wrist_motor}
    wrist_yaw:      {effort_Nm: 5,  velocity_rads: 22, mjcf_class: wrist_motor}
    waist_yaw:      {effort_Nm: 88, velocity_rads: 32}
    waist_roll:     {effort_Nm: 35, velocity_rads: 30}
    # 참고 (다리, 비교표 미포함): hip 88/32, knee 139/20, ankle 50/37  ← Isaac Lab G1_29DOF_CFG 와 일치
  motor_mass_kg: null
  gear_ratio: null

unitree_h1:
  source_urdf: https://github.com/unitreerobotics/unitree_ros/blob/master/robots/h1_description/urdf/h1.urdf
  joints:
    shoulder_pitch: {effort_Nm: 40, velocity_rads: 9}
    shoulder_roll:  {effort_Nm: 40, velocity_rads: 9}
    shoulder_yaw:   {effort_Nm: 18, velocity_rads: 20}
    elbow:          {effort_Nm: 18, velocity_rads: 20}
  motor_mass_kg: null

unitree_h1_2:
  source_urdf: https://github.com/unitreerobotics/unitree_ros/blob/master/robots/h1_2_description/h1_2.urdf
  joints:
    shoulder_pitch: {effort_Nm: 40, velocity_rads: 9}
    shoulder_yaw:   {effort_Nm: 18, velocity_rads: 20}
    elbow:          {effort_Nm: 18, velocity_rads: 20}
    wrist_roll:     {effort_Nm: 19, velocity_rads: 31.4}
    wrist_pitch:    {effort_Nm: 19, velocity_rads: 31.4}

