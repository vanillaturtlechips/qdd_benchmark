# 자체 설계 QDD, 설계 공개 (논문)
# =====================================================================================
mit_humanoid:   # Table II + 관절표. 다이노 실측: U10 포화 ~31 Nm, U12 68 Nm (기어 한계). 팔은 3-DoF.
  source: https://arxiv.org/pdf/2104.09025
  modules:
    U10: {mass_kg: 0.619, gear_ratio: 6, peak_torque_Nm: 33.6, max_speed_rads_60V: 55, output_inertia_kgm2: 0.0023, dyno_saturation_Nm: 31}
    U12: {mass_kg: 1.174, gear_ratio: 6, peak_torque_Nm: 68.0, max_speed_rads_60V: 45, output_inertia_kgm2: 0.02,  dyno_saturation_Nm: 68}
  joints:   # 벨트 증속 포함한 관절 기준값
    shoulder_abad:    {module: U10, total_ratio: 6.0,  torque_Nm: 33.6,  speed_rads: 55}
    shoulder_flexion: {module: U10, total_ratio: 6.0,  torque_Nm: 33.6,  speed_rads: 55}
    elbow:            {module: U10, total_ratio: 9.33, torque_Nm: 52.2,  speed_rads: 35}
    hip_yaw:          {module: U10, total_ratio: 6.0,  torque_Nm: 33.6,  speed_rads: 55}
    hip_flexion:      {module: U12, total_ratio: 6.0,  torque_Nm: 68.0,  speed_rads: 45}
    knee:             {module: U12, total_ratio: 12.0, torque_Nm: 136.0, speed_rads: 22.5}
    ankle:            {module: U10, total_ratio: 9.33, torque_Nm: 52.2,  speed_rads: 35}

