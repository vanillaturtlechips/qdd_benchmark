    shoulder_roll:  {class: motor_03, kp: 100, kd: 4, soft_torque_limit_Nm: 42}
    shoulder_yaw:   {class: motor_02, kp: 40,  kd: 2, soft_torque_limit_Nm: 11.9}
    elbow:          {class: motor_02, kp: 40,  kd: 2, soft_torque_limit_Nm: 11.9}
    wrist:          {class: motor_00, kp: 20,  kd: 2, soft_torque_limit_Nm: 9.8}
    hip_pitch: {class: motor_04}
    hip_roll:  {class: motor_03}
    hip_yaw:   {class: motor_03}
    knee:      {class: motor_04}
    ankle:     {class: motor_02}

