    motor_00: {actuator: RS00, armature_kgm2: 0.005,  frictionloss_Nm: 0.1,    actuatorfrc_Nm: 14,  urdf_effort_Nm: 14,  urdf_velocity_rads: 27.227}
    motor_02: {actuator: RS02, armature_kgm2: 0.0015, frictionloss_Nm: 0.1,    actuatorfrc_Nm: 17,  urdf_effort_Nm: 17,  urdf_velocity_rads: 37.699}
    motor_03: {actuator: RS03, armature_kgm2: 0.005,  frictionloss_Nm: 0.001,  actuatorfrc_Nm: 60,  urdf_effort_Nm: 60,  urdf_velocity_rads: 18.849}
    motor_04: {actuator: RS04, armature_kgm2: 0.007,  frictionloss_Nm: 0.0015, actuatorfrc_Nm: 120, urdf_effort_Nm: 120, urdf_velocity_rads: 17.488}
  joints:   # kp/kd/soft_torque_limit 는 metadata.json 의 실기 운용값
