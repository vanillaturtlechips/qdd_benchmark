notes:
- J 는 0.1~3.5 Hz 처프에서 추정. 3.5 Hz 이상(0.3 Nm 진폭)에서는 출력 변위 <1° 로 백래시 영역 → J 가 0.003→0.001
  로 감소 (비강체 전달 특성). 강체 DCMotor 모델에는 저주파 J 사용
- 'J 는 여기 진폭 의존성 있음: 공진 처프(0.6 Nm, ±0.36 rad) 0.0060 / 중력보상 처프(0.3 Nm, ±0.26 rad)
  0.0043. 계통 불확실성 ±0.0015 (armature 기준 ±100%)'
- velocity_limit 은 데이터시트 무부하 200 rpm (미실측)
- 'joint7 은 중력 정렬 축이 아님: m·g·d = 0.72 Nm (link7 + 그리퍼)'
armature_measurement_withdrawn:
  J_total_chirp: 0.0059
  I_link_urdf: 0.00559
  I_link_gravity_implied: ≥0.0075 (시뮬 중력 0.54 vs 실측 0.72 Nm → 실제 그리퍼가 URDF 보다 무거움,
    그리퍼 모터 DM4310 0.3 kg 미포함 추정)
  conclusion: J_total − I_link = 0.0003 (또는 음수). 그리퍼 관성 불확실성(≥0.002)이 armature(0.0017)보다
    커서 joint7 에서는 armature 를 실측으로 분리할 수 없음. 2026-09-22 오전의 '펌웨어와 5 % 일치' 주장은 hand
    질량을 0 으로 놓은 계산 오류였으므로 철회
